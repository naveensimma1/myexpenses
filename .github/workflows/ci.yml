name: MyExpenses CI

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
jobs:
  validate-html:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4 

      - name: Show Repository Files
        run: ls -la

      - name: Show HTML Statistics
        run: |
          echo "Lines:"
          wc -l index.html

      - name: Search for HTML Tags
        run: |
          grep -i "<html" index.html
          grep -i "<body" index.html

      - name: Create Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myexpenses-html
          path: index.html

      - name: Mark Build Success
        run: echo "CI completed successfully"

      - name: Checking Html tags
        run: echo "html tag is checked"